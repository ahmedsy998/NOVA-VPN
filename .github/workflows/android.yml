name: NOVA VPN Android CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build NOVA VPN Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses and install required packages
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "${SDK_DIR}" ]; then
            echo "::error::Android SDK directory not found at ${SDK_DIR}"
            exit 1
          fi
          echo "ANDROID_HOME=${SDK_DIR}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_DIR}" >> "$GITHUB_ENV"

          # Accept SDK licenses non-interactively before package installation
          (yes || true) | sdkmanager --sdk_root="${SDK_DIR}" --licenses >/dev/null

          # Install each required SDK package as an independent, properly quoted argument
          sdkmanager --sdk_root="${SDK_DIR}" --install \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      - name: Verify Android SDK diagnostics and installed packages
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          echo "sdkmanager path: $(command -v sdkmanager)"
          sdkmanager --version
          INSTALLED_PACKAGES="$(sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --list_installed)"
          echo "${INSTALLED_PACKAGES}"
          for pkg in "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"; do
            if ! printf '%s\n' "${INSTALLED_PACKAGES}" | grep -qF "${pkg}"; then
              echo "::error::Required Android SDK package not installed: ${pkg}"
              exit 1
            fi
          done

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant executable permission to gradlew
        run: |
          set -euo pipefail
          if [ ! -f "./gradlew" ]; then
            echo "::error::Gradle wrapper script (gradlew) is missing from the repository root."
            exit 1
          fi
          chmod +x ./gradlew

      - name: Prepare debug and optional release signing keystores
        id: signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          # Ensure a valid debug.keystore is available without failing if debug.keystore.base64 is absent
          if [ -f "debug.keystore" ] && [ -s "debug.keystore" ]; then
            echo "Using existing debug.keystore."
          elif [ -f "debug.keystore.base64" ] && [ -s "debug.keystore.base64" ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 --decode > debug.keystore
            echo "Decoded debug.keystore from debug.keystore.base64."
          elif [ -f "${HOME}/.android/debug.keystore" ] && [ -s "${HOME}/.android/debug.keystore" ]; then
            cp "${HOME}/.android/debug.keystore" debug.keystore
            echo "Copied standard Android debug.keystore from ${HOME}/.android/debug.keystore."
          else
            echo "No debug keystore found in repository; generating standard Android debug keystore via keytool."
            keytool -genkeypair \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Release signing is strictly optional
          if [ -n "${RELEASE_KEYSTORE_BASE64}" ] && [ -n "${STORE_PASSWORD}" ] && [ -n "${KEY_PASSWORD}" ]; then
            if printf '%s' "${RELEASE_KEYSTORE_BASE64}" | tr -d '[:space:]' | base64 --decode > my-upload-key.jks && [ -s "my-upload-key.jks" ]; then
              echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> "$GITHUB_ENV"
              echo "release_supported=true" >> "$GITHUB_OUTPUT"
              echo "Release signing secrets detected. Optional signed release APK build enabled."
            else
              rm -f my-upload-key.jks
              echo "release_supported=false" >> "$GITHUB_OUTPUT"
              echo "::warning::Failed to decode RELEASE_KEYSTORE_BASE64 into a valid keystore. Skipping optional release build."
            fi
          else
            echo "release_supported=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets not configured. Skipping optional release build; debug APK will be built."
          fi

      - name: Resolve Gradle dependencies
        run: ./gradlew :app:dependencies --configuration debugRuntimeClasspath --no-daemon >/dev/null

      - name: Run unit and Robolectric tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        id: build_debug
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build optional signed release APK
        id: build_release
        if: steps.signing.outputs.release_supported == 'true'
        continue-on-error: true
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Report optional release build status
        if: steps.signing.outputs.release_supported == 'true' && steps.build_release.outcome == 'failure'
        run: echo "::warning::Optional signed release APK build failed (check keystore alias/passwords). Proceeding with verified debug APK."

      - name: Locate and verify generated APKs
        id: locate_apk
        run: |
          set -euo pipefail
          if [ ! -d "app/build/outputs/apk" ]; then
            echo "::error::APK output directory app/build/outputs/apk does not exist."
            exit 1
          fi

          mapfile -t APK_CANDIDATES < <(find app/build/outputs/apk -type f -name "*.apk" ! -name "*-unsigned.apk" | sort)
          if [ "${#APK_CANDIDATES[@]}" -eq 0 ]; then
            echo "::error::No signed APK files were found under app/build/outputs/apk/."
            exit 1
          fi

          VERIFIED_APKS=()
          for apk in "${APK_CANDIDATES[@]}"; do
            if [ ! -f "${apk}" ]; then
              echo "::error::Expected APK file does not exist: ${apk}"
              exit 1
            fi
            if [ ! -s "${apk}" ]; then
              echo "::error::Generated APK is empty (0 bytes): ${apk}"
              exit 1
            fi
            echo "Verified APK output path: ${apk}"
            ls -lh "${apk}"
            VERIFIED_APKS+=("${apk}")
          done

          {
            echo "apk_paths<<EOF"
            printf '%s\n' "${VERIFIED_APKS[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "has_apk=true" >> "$GITHUB_OUTPUT"

      - name: Upload NOVA VPN APK artifact
        if: steps.locate_apk.outputs.has_apk == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-VPN-APK
          path: ${{ steps.locate_apk.outputs.apk_paths }}
          retention-days: 30
          if-no-files-found: error
